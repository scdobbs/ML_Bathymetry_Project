[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bathy-diffusion"
version = "0.1.0"
description = "Ship-multibeam roughness analysis, predictors and blind-test scoring for co-located ship/AUV bathymetry (GRL 2026GL125574); includes the superseded rectified-flow super-resolution model"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "preprocessing*", "training*", "inference*", "evaluation*", "utils*"]
exclude = ["data_for_model*", "notebooks*", "sherlock*", "results*"]
