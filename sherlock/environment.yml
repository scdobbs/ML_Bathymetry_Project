name: bathy_diffusion
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

# Pinned to match the Sherlock module loaded by the .sbatch jobs:
#     module load py-pytorch/2.4.1_py312
# Gap to track: PyTorch 2.5+ is the rewrite target (better flash-attn-2 / SDPA
# paths). Upgrade as soon as a 2.5+ module is published on the cluster.
dependencies:
  # Python
  - python=3.12

  # PyTorch with CUDA 12.1 (matches Sherlock module + flash-attn 2.x wheels)
  - pytorch=2.4.1
  - torchvision
  - pytorch-cuda=12.1

  # Geospatial
  - rasterio=1.3.*
  - gdal
  - pyproj

  # Scientific computing
  - numpy
  - scipy
  - scikit-image

  # Visualization
  - matplotlib
  - tqdm

  # ML utilities
  - tensorboard
  - einops

  # Notebook support (optional, for local analysis)
  - jupyter
  - ipykernel

  # pip-only packages
  - pip
  - pip:
    # Gated on CUDA 12.x; --no-build-isolation avoids a torch re-resolve.
    - flash-attn==2.6.3 --no-build-isolation
