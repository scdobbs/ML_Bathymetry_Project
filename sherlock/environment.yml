name: bathy_diffusion
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # Python (match Sherlock's ecosystem)
  - python=3.12

  # PyTorch with CUDA 12.4 (Sherlock A100/V100 nodes)
  - pytorch>=2.2
  - torchvision
  - pytorch-cuda=12.4

  # Geospatial (conda-forge handles native GDAL/PROJ deps)
  - rasterio
  - pyproj

  # Scientific computing
  - numpy
  - scipy
  - scikit-image

  # Visualization
  - matplotlib
  - tqdm

  # ML utilities
  - tensorboard

  # pip-only packages
  - pip
  - pip:
    - tensorboardX
