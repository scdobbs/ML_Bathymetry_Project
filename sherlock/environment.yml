name: bathy_diffusion
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

# Pinned to match the Sherlock module loaded by the .sbatch jobs:
#     module load py-pytorch/2.4.1_py312
# Stage 6 gap to track: PyTorch 2.5+ is the upstream target (better
# flash-attn-2 / SDPA paths). Bump the pin here and the module load line
# in the .sbatch files together when a 2.5+ build is published on serc.
dependencies:
  # Python
  - python=3.12

  # PyTorch with CUDA 12.1 (matches Sherlock module + flash-attn 2.x wheels;
  # triton ships with the PyTorch wheel, no separate install needed).
  - pytorch=2.4.1
  - torchvision
  - pytorch-cuda=12.1

  # Geospatial
  - rasterio>=1.3
  - gdal
  - pyproj

  # Scientific computing
  - numpy
  - scipy
  - scikit-image

  # Visualization
  - matplotlib
  - tqdm

  # ML utilities
  - tensorboard
  - einops

  # Notebook support (optional, for local analysis)
  - jupyter
  - ipykernel

  # pip-only packages
  - pip
  - pip:
    # flash-attn requires CUDA 12.x; --no-build-isolation avoids a torch
    # re-resolve at install time.
    - flash-attn==2.6.3 --no-build-isolation
    # Editable install of the project itself so `python -m training.train`
    # resolves cleanly from any working directory.
    - -e ..
